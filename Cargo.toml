[package]
name = "gpr_studio"
version = "0.1.0"
edition = "2021"
description = "GPR Studio: ground-penetrating radar processing, picking, mapping and reporting"
readme = "README.md"

[[bin]]
name = "gpr_studio"
path = "src/main.rs"

[dependencies]
# Explicit window backends are required on Linux when default features are disabled.
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
tiff = "0.9"
proj4rs = "0.1"
crs-definitions = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
rustfft = "6"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
